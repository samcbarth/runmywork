name: Project notifications

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check projects and send notifications
        run: node scripts/check-notify.js
        env:
          NTFY_TOPIC: rmw-sam-9k2x7p
