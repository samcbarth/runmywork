<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Personal project progress tracker">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RunMyWork">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <title>RunMyWork</title>
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" onclick="App.navigate('settings')" aria-label="Settings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="app-title-btn" onclick="App.navigate('')">
      <span class="app-title">RunMyWork</span>
    </button>
    <button class="agent-chip" id="agent-chip" onclick="App.runAgentNow()" title="Cloud agent — tap to run now">
      <span class="agent-chip-dot" id="agent-chip-dot"></span>
      <span class="agent-chip-text" id="agent-chip-text">🤖</span>
    </button>
    <button class="icon-btn" onclick="App.navigate('approvals')" aria-label="Approvals inbox" title="Approvals inbox" style="position:relative;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
      <span id="approvals-badge" class="hidden" style="position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--c-blocked,#e5484d);color:#fff;font-size:0.62rem;line-height:16px;text-align:center;font-weight:700;"></span>
    </button>
    <button class="icon-btn icon-btn-accent" onclick="Views.ProjectForm.open()" aria-label="New project" title="New project">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </header>

  <main id="view-root" class="view-root">
    <div id="proposals-section">
        <h2>Proposed Tasks</h2>
        <ul id="proposals-list"></ul>
    </div>
</main>

  <div id="modal-overlay" class="modal-overlay hidden" onclick="App.closeModal()"></div>
  <div id="modal-container" class="modal-container hidden"></div>

  <script src="./js/models.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/views/dashboard.js"></script>
  <script src="./js/views/project-form.js"></script>
  <script src="./js/views/project-detail.js"></script>
  <script src="./js/views/session-modal.js"></script>
  <script src="./js/views/settings.js"></script>
  <script src="./js/views/approvals.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
